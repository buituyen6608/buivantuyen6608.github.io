<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hồ cá</title>

<style>
body {
margin: 0;
background-color: #06121c;
text-align: center;
}

h1 {
color: white;
}

#hoca {
position: relative;
width: 900px;
height: 500px;
margin: 0 auto;
border: 10px solid #1d3b4f;
overflow: hidden;
background: linear-gradient(#5fc4dc, #2a8fb5, #15597f, #0c3550);
}

#cat {
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 60px;
background: linear-gradient(#e8d3a2, #cdb27a);
}
.sinhvat {
position: absolute;
}
#diver1 { width: 150px; animation: boi_diver1 40s infinite; }
#diver2 { width: 150px; animation: boi_diver2 32s infinite; }
#diver3 { width: 150px; animation: boi_diver3 48s infinite; }
#shark { width: 180px; animation: boi_shark 20s infinite; }
#turtle { width: 120px; animation: boi_turtle 60s infinite; }
#faintSchool { width: 130px; animation: boi_faintschool 28s infinite; }
#goldFishSchool { width: 90px; animation: boi_goldfishschool 24s infinite; }

@keyframes boi_diver1 {
0% { left: 3%; top: 12%; transform: scaleX(1); }
29% { left: 62%; top: 38%; transform: scaleX(1); }
29.5% { left: 62%; top: 38%; transform: scaleX(-1); }
73% { left: 21%; top: 52%; transform: scaleX(-1); }
100% { left: 3%; top: 12%; transform: scaleX(-1); }
}

@keyframes boi_diver2 {
0% { left: 74%; top: 18%; transform: scaleX(-1); }
41% { left: 18%; top: 43%; transform: scaleX(-1); }
41.5% { left: 18%; top: 43%; transform: scaleX(1); }
69% { left: 58%; top: 63%; transform: scaleX(1); }
100% { left: 74%; top: 18%; transform: scaleX(1); }
}
@keyframes boi_diver3 {
0% { left: 37%; top: 57%; transform: scaleX(1); }
35% { left: 79%; top: 33%; transform: scaleX(1); }
35.5% { left: 79%; top: 33%; transform: scaleX(-1); }
71% { left: 12%; top: 8%; transform: scaleX(-1); }
71.5% { left: 12%; top: 8%; transform: scaleX(1); }
100% { left: 37%; top: 57%; transform: scaleX(1); }
}

@keyframes boi_shark {
0% { left: 1%; top: 24%; transform: scaleX(1); }
37% { left: 71%; top: 41%; transform: scaleX(1); }
37.5% { left: 71%; top: 41%; transform: scaleX(-1); }
64% { left: 8%; top: 4%; transform: scaleX(-1); }
100% { left: 1%; top: 24%; transform: scaleX(-1); }
}
@keyframes boi_turtle {
0% { left: 8%; top: 61%; transform: scaleX(1); }
31% { left: 83%; top: 51%; transform: scaleX(1); }
31.5% { left: 83%; top: 51%; transform: scaleX(-1); }
68% { left: 31%; top: 28%; transform: scaleX(-1); }
100% { left: 8%; top: 61%; transform: scaleX(-1); }
}

@keyframes boi_faintschool {
0% { left: 63%; top: 19%; transform: scaleX(-1); }
27% { left: 14%; top: 31%; transform: scaleX(-1); }
27.5% { left: 14%; top: 31%; transform: scaleX(1); }
74% { left: 47%; top: 59%; transform: scaleX(1); }
100% { left: 63%; top: 19%; transform: scaleX(1); }
}

@keyframes boi_goldfishschool {
0% { left: 24%; top: 53%; transform: scaleX(1); }
39% { left: 74%; top: 12%; transform: scaleX(1); }
39.5% { left: 74%; top: 12%; transform: scaleX(-1); }
61% { left: 39%; top: 38%; transform: scaleX(-1); }
100% { left: 24%; top: 53%; transform: scaleX(1); }
}
.rong {
position: absolute;
bottom: 40px;
width: 18px;
border-radius: 50% 50% 0 0 / 80% 80% 0 0;
transform-origin: bottom;
animation: lac 3s ease-in-out infinite alternate;
}

@keyframes lac {
from { transform: rotate(-8deg); }
to { transform: rotate(8deg); }
}

.bongbong {
position:absolute;
bottom: 40px;
background-color:rgba(255, 255, 255, 0.4);
border: 1px solid white;
border-radius: 50%;
animation: noilen 6s linear infinite;
}

@keyframes noilen {
from { transform: translateY(0); opacity: 1; }
to { transform: translateY(-450px); opacity: 0; }
}
.trangtri {
position: absolute;
bottom: 30px;
}
</style>
</head>

<body>
<h1>Thủy Cung</h1>

<div id="hoca">

<svg class="trangtri" style="left: 22%; width: 110px;" viewBox="0 0 120 70">
<path d="M0 70 C5 30 30 10 55 22 C75 5 105 25 120 70Z" fill="#6b7a86"/>
<path d="M20 70 C25 45 40 38 55 45 C70 35 90 45 100 70Z" fill="#8493a0"/>
</svg>

<path d="M40 90V45M40 60 20 40V22M40 50 62 32V14M20 40 8 30M62 32 74 24"/>
</g>
</svg>
<svg class="trangtri" style="left: 68%; width: 90px;" viewBox="0 0 100 70">
<rect x="5" y="30" width="90" height="38" rx="4" fill="#8a5a2b"/>
<path d="M5 32C5 8 95 8 95 32Z" fill="#a8702f"/>
<rect x="5" y="30" width="90" height="6" fill="#d4a03a"/>
<rect x="44" y="28" width="12" height="16" rx="2" fill="#f2c14e"/>
</svg>

<div class="rong" style="left: 2%; height: 110px; background-color: #2f9e55; animation-delay: -0.5s;"></div>

<div class="rong" style="left: 19%; height: 130px; background-color: #3dbb6a; animation-delay: -2s;"></div>
<div class="rong" style="left: 30%; height: 100px; background-color: #2f9e55; animation-delay: -0.8s;"></div>
<div class="rong" style="left: 38%; height: 140px; background-color: #278a49; animation-delay: -1.2s;"></div>
<div class="rong" style="left: 50%; height: 120px; background-color: #46c878; animation-delay: -1.8s;"></div>
<div class="rong" style="left: 58%; height: 160px; background-color: #3dbb6a; animation-delay: -2.2s;"></div>
<div class="rong" style="left: 66%; height: 95px; background-color: #2f9e55; animation-delay: -0.3s;"></div>
<div class="rong" style="left: 74%; height: 145px; background-color: #278a49; animation-delay: -1.1s;"></div>
<div class="rong" style="left: 82%; height: 170px; background-color: #46c878; animation-delay: -1.7s;"></div>
<div class="rong" style="left: 88%; height: 105px; background-color: #3dbb6a; animation-delay: -2.4s;"></div>
<div class="rong" style="left: 93%; height: 135px; background-color: #2f9e55; animation-delay: -0.6s;"></div>
<div class="rong" style="left: 97%; height: 115px; background-color: #278a49; animation-delay: -1.4s;"></div>
<div class="bongbong" style="left: 6%; width: 8px; height: 8px; animation-duration: 6s; animation-delay: -1s;"></div>
<div class="bongbong" style="left: 20%; width: 12px; height: 12px; animation-duration: 7s; animation-delay: -3s;"></div>
<div class="bongbong" style="left: 34%; width: 10px; height: 10px; animation-duration: 8s; animation-delay: -2s;"></div>
<div class="bongbong" style="left: 47%; width: 14px; height: 14px; animation-duration: 6s; animation-delay: -4s;"></div>
<div class="bongbong" style="left: 60%; width: 9px; height: 9px; animation-duration: 5s; animation-delay: -1s;"></div>
<div class="bongbong" style="left: 72%; width: 11px; height: 11px; animation-duration: 8s; animation-delay: -3s;"></div>
<div class="bongbong" style="left: 85%; width: 7px; height: 7px; animation-duration: 7s; animation-delay: -5s;"></div>
<div class="bongbong" style="left: 94%; width: 12px; height: 12px; animation-duration: 6s; animation-delay: -2s;"></div>

<img class="sinhvat" id="diver1" src="diver1.png">
<img class="sinhvat" id="diver2" src="diver2.png">
<img class="sinhvat" id="diver3" src="diver3.png">
<img class="sinhvat" id="shark" src="shark.png">
<img class="sinhvat" id="turtle" src="turtle.png">
<img class="sinhvat" id="faintSchool" src="faintSchool.png">
<img class="sinhvat" id="goldFishSchool" src="goldFishSchool.png">

<div id="cat"></div>
</div>
</body>
</html>
